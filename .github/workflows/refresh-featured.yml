name: Refresh featured projects
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: featured-projects
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select popular public repositories
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          node --test tools/featured.test.mjs
          gh api --paginate "users/$PROFILE_OWNER/repos?type=owner&per_page=100" | jq -s 'add' > repos.json
          node --input-type=module -e 'import { readFileSync, writeFileSync } from "node:fs"; import { featured } from "./tools/featured.mjs"; const path="README.md"; const source=readFileSync(path,"utf8"); const next=featured(source, process.env.PROFILE_OWNER, JSON.parse(readFileSync("repos.json","utf8"))); if (source!==next) writeFileSync(path,next);'
      - name: Publish changes
        run: |
          git add -- README.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh featured projects'
          for attempt in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; done
          exit 1

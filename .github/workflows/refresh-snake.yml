name: Refresh contribution snake
on:
  schedule:
    - cron: '28 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-snake
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-light&color_snake=%235f6368
            assets/snake-dark.svg?palette=github-dark&color_snake=%23bbc2c9
      - name: Remove progress bars and publish
        run: |
          node tools/strip-snake-progress.mjs assets/snake.svg assets/snake-dark.svg
          git add -- assets/snake.svg assets/snake-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh contribution snake'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

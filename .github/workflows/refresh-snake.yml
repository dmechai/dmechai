name: Refresh contribution snake
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-snake
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Preserve the complete-history contribution graphic
        run: echo 'The host profile timer regenerates this graphic from complete Git history.'

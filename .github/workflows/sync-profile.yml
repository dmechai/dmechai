name: Sync featured projects

on:
  push:
    branches: [main]
    paths:
      - README.md
      - tools/**
      - .github/workflows/sync-profile.yml
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-featured-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Test and sync
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          node --test tools/*.test.mjs
          gh api --paginate "users/$PROFILE_OWNER/repos?type=owner&per_page=100" | jq -s . | node tools/sync-profile.mjs "$PROFILE_OWNER"
      - name: Publish changes
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'Sync featured projects'
          git push origin HEAD:main

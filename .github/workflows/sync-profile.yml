name: Sync GitHub profile

on:
  push:
    branches: [main]
    paths:
      - README.md
      - tools/**
      - .pages.yml
      - .github/workflows/sync-profile.yml
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-featured-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Prepare animation output
        run: mkdir -p assets
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-light&color_snake=%235f6368
            assets/snake-dark.svg?palette=github-dark&color_snake=%23bbc2c9
      - name: Test and sync
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          node --test tools/*.test.mjs
          gh api --paginate "users/$PROFILE_OWNER/repos?type=owner&per_page=100" | jq -s . | node tools/sync-profile.mjs "$PROFILE_OWNER"
      - name: Publish changes
        run: |
          git add -- README.md .pages.yml
          if [[ -s assets/snake.svg && -s assets/snake-dark.svg ]]; then
            git add -- assets/snake.svg assets/snake-dark.svg
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync GitHub profile'
          git push origin HEAD:main
